# Script IDE — a SECOND gateway, so the compare feature can be proved between
# two machines rather than against a loopback.
#
# This exists for F2 in `docs/PRODUCT-REVIEW.md`: every proof this module had
# was on one gateway, and R5's own suite configures a peer pointing at the
# gateway it is running on. That exercises the config, the token, the client,
# the digest and the comparison — and cannot prove the two ends are different
# machines, which is the one thing the feature claims.
#
# DISPOSABLE. It is created for a validation run and destroyed after:
#
#   cd dockers
#   ./peer.sh up          # generates .env, starts, waits for RUNNING
#   ./peer.sh down        # removes the container AND its volume
#
# Conventions follow web-designer's contributor gateway, which is the estate's
# worked example of a portable disposable rig: the STOCK image (never a custom
# build), published ports rather than host networking so nothing collides with
# the module-testing gateway, and the memory caps commissioned on the fresh
# volume.
# An EXPLICIT project name, and it is load-bearing. Compose defaults the
# project to the DIRECTORY name, and web-designer's contributor gateway also
# lives in a directory called `dockers` — so without this, `docker compose up`
# here adopts that project's containers and removes the ones it does not
# recognise as orphans. It did exactly that on 06/09/2026: the first run of
# this file deleted `webdesigner-dev-gateway`. Its volume survived, but
# nothing warned first.
name: scriptide-peer

services:
  ignition:
    image: inductiveautomation/ignition:8.3.8
    container_name: scriptide-peer-gateway
    ports:
      # 8088 is the module-testing gateway (host networking), 8098/8143 are
      # web-designer's contributor rig. 8099 is free.
      - "8099:8088"
    volumes:
      - scriptide-peer-data:/usr/local/bin/ignition/data
    environment:
      - ACCEPT_IGNITION_EULA=Y
      - GATEWAY_ADMIN_USERNAME=${GATEWAY_ADMIN_USERNAME:-admin}
      - GATEWAY_ADMIN_PASSWORD=${GATEWAY_ADMIN_PASSWORD:?run ./peer.sh up, which generates dockers/.env}
      - IGNITION_EDITION=standard
      # COMMISSIONING ONLY. docker-entrypoint.sh reads these when it writes a
      # FRESH data volume and ignores them on every later start, because from
      # then on data/ignition.conf inside the volume is authoritative. They are
      # correct here precisely because this volume is always fresh.
      - GATEWAY_MAX_MEMORY=1024m
      - GATEWAY_INIT_MEMORY=256m
      # glibc hands a process up to 8 x cores malloc arenas and Ignition's ~220
      # threads spread allocations across all of them, so RSS runs far above the
      # heap. Capping arenas is where the saving is: measured 4.6 GB -> 774 MB
      # on the module-testing gateway, with no cost under load.
      - MALLOC_ARENA_MAX=2
    # -m rewrites wrapper.java.maxmemory on EVERY start, so it stays
    # authoritative where the two commissioning-only vars above do not.
    command: [ "-m", "1024" ]
    restart: "no"

volumes:
  scriptide-peer-data:
